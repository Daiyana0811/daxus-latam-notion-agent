name: Daxus LATAM to Notion Agent

on:
  schedule:
    # Every Monday at 14:00 UTC, which is 09:00 in America/Bogota.
    # The first step skips all Mondays except the last Monday of the month.
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip the course sync step and only run transcription.'
        required: false
        default: 'false'
      course_limit:
        description: 'Maximum pending courses to transcribe in this run. Empty means all.'
        required: false
        default: '3'
      auto_continue:
        description: 'Queue another batch if pending courses remain.'
        required: false
        default: 'false'
      overwrite:
        description: 'Replace existing Transcripcion files.'
        required: false
        default: 'false'
      course_name:
        description: 'Specific course name to transcribe. Empty means pending courses.'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check schedule
        id: schedule_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_month="$(date -u +%m)"
          next_week_month="$(date -u -d '+7 days' +%m)"

          if [ "$current_month" != "$next_week_month" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because this Monday is not the last Monday of the month."
          fi

      - name: Checkout repository
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.schedule_check.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate source
        if: steps.schedule_check.outputs.should_run == 'true'
        run: npm run check

      - name: Run agent
        if: steps.schedule_check.outputs.should_run == 'true' && github.event.inputs.skip_sync != 'true'
        env:
          DAXUS_EMAIL: ${{ secrets.DAXUS_EMAIL }}
          DAXUS_PASSWORD: ${{ secrets.DAXUS_PASSWORD }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: 901c32bcda2c8204a1ff817988963f14
        run: npm start

      - name: Run transcription upload
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          DAXUS_EMAIL: ${{ secrets.DAXUS_EMAIL }}
          DAXUS_PASSWORD: ${{ secrets.DAXUS_PASSWORD }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: 901c32bcda2c8204a1ff817988963f14
          SHAREPOINT_EMAIL: ${{ secrets.SHAREPOINT_EMAIL }}
          SHAREPOINT_PASSWORD: ${{ secrets.SHAREPOINT_PASSWORD }}
          SHAREPOINT_STORAGE_STATE_B64: ${{ secrets.SHAREPOINT_STORAGE_STATE_B64 }}
          SHAREPOINT_SITE_BASE_URL: https://zakidatasas.sharepoint.com/sites/general
          SHAREPOINT_COURSES_SERVER_RELATIVE: /sites/general/Documentos compartidos/1. COMUNICACIONES/1.CURSOS
          COURSE_LIMIT: ${{ github.event.inputs.course_limit }}
          COURSE_NAME: ${{ github.event.inputs.course_name }}
          OVERWRITE_TRANSCRIPTIONS: ${{ github.event.inputs.overwrite }}
        shell: bash
        run: |
          if [ -n "$COURSE_NAME" ]; then
            args=("$COURSE_NAME" --upload-notion)
          else
            args=(--all --upload-notion)
          fi

          if [ -z "$COURSE_NAME" ] && [ -n "$COURSE_LIMIT" ]; then
            args+=("--course-limit=$COURSE_LIMIT")
          fi

          if [ "$OVERWRITE_TRANSCRIPTIONS" = "true" ]; then
            args+=(--overwrite --include-existing-transcriptions)
          fi

          node transcription.js "${args[@]}"

      - name: Count pending transcriptions
        id: pending_transcriptions
        if: steps.schedule_check.outputs.should_run == 'true' && github.event.inputs.auto_continue == 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: 901c32bcda2c8204a1ff817988963f14
        run: node scripts/count-pending-transcriptions.js

      - name: Queue next transcription batch
        if: steps.schedule_check.outputs.should_run == 'true' && github.event.inputs.auto_continue == 'true' && steps.pending_transcriptions.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_LIMIT: ${{ github.event.inputs.course_limit }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/agent.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"skip_sync\":\"true\",\"course_limit\":\"${COURSE_LIMIT:-3}\",\"auto_continue\":\"true\",\"overwrite\":\"false\"}}"
